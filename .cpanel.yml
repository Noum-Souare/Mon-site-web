---
deployment:
  tasks:
    # Username correct confirmé : weenoovc
    - export DEPLOYPATH=/home/weenoovc/Mon-site-web/
    
    # Nettoyer public_html en gardant les fichiers système
    - /bin/find $DEPLOYPATH -type f -not -name '.htaccess' -not -name 'robots.txt' -not -name 'error_log' -delete
    
    # Copier TOUT le contenu du dossier dist (build de Vite)
    - /bin/cp -R dist/* $DEPLOYPATH
    
    # IMPORTANT: Configurer les bonnes permissions (résout l'erreur 403)
    - /bin/find $DEPLOYPATH -type f -exec chmod 644 {} \;
    - /bin/find $DEPLOYPATH -type d -exec chmod 755 {} \;
    
    # Permissions spéciales pour index.html
    - /bin/chmod 644 $DEPLOYPATH/index.html